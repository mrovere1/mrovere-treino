];

let showHist=false,af='all',tf='all';

function renderAll(){renderBanner();renderStats();renderMotive();renderAgenda();renderEmails();renderWeek();renderActions();renderSlack();}

function renderBanner(){
  const bannerItems=[
    '⚠️ CONFLITO 10:45-12h — Webinar Hexa AI vs Mythos Preview — escolher um para acompanhar',
    '🍽️ Almoço VISION AMANHÃ 13/ago 11:30h Corrientes 348 SP — preparar hoje',
    '📊 Rob Karnbach compartilhou 3 planilhas NFR — revisar parceiros BR',
    '🏨 PRESENCIAL SP ter 18/ago — Breakfast Mark Thurmond — organizar viagem até sex',
  ].slice(0,4);
  document.getElementById('pbanner').style.display='flex';
  document.getElementById('pitems').innerHTML=bannerItems.map(i=>`<span class="ppill">${i}</span>`).join('');
}

function renderStats(){
  const open=actionItems.filter(a=>a.status==='open').length;
  const hi=actionItems.filter(a=>a.priority==='high'&&a.status==='open').length;
  const newT=actionItems.filter(a=>!a.inherited&&a.status==='open').length;
  document.getElementById('stats').innerHTML=[
    {icon:"&#128197;",val:agendaItems.length,lbl:"Compromissos hoje",d:"1 conflito de horário 10:45-12h"},
    {icon:"&#128269;",val:newT,lbl:"Novos hoje",d:`${newT} novas | ${hi} high total`},
    {icon:"&#9989;",val:open,lbl:"Actions abertas",d:`${hi} high | ${open-hi} outros`},
    {icon:"&#128172;",val:0,lbl:"Slack pendências",d:"Nenhuma menção nova"},
  ].map(s=>`<div class="scard"><span class="sicon">${s.icon}</span><div><div class="sval">${s.val}</div><div class="slbl">${s.lbl}</div><div class="sdelta">${s.d}</div></div></div>`).join('');
}

function renderMotive(){
  document.getElementById('motive').innerHTML=motives[1];
}

function renderAgenda(){
  document.getElementById('agCnt').textContent=agendaItems.length;
  if(!agendaItems.length){
    document.getElementById('agBody').innerHTML='<div style="text-align:center;padding:24px 0;color:var(--tm);font-size:12px">Sem compromissos hoje.</div>';
    return;
  }
  const fh={urgent:'<span class="flag f-urgent">URGENTE</span>',ext:'<span class="flag f-ext">Externo</span>',back:'<span class="flag f-back">Back-to-back</span>',conflict:'<span class="flag f-conflict">⚠️ Conflito</span>',prep:'<span class="flag f-prep">PREP</span>'};
  document.getElementById('agBody').innerHTML=agendaItems.map(a=>`
    <div class="ai">
      <div class="aitime">${a.time}</div>
      <div style="flex:1">
        <div class="ainame">${a.title}</div>
        <div class="aimeta">
          ${a.link?`<a class="alink" href="${a.link}" target="_blank">Entrar</a>`:''}
          ${a.attendees?`<span style="font-size:11px;color:var(--tm)">${a.attendees}</span>`:''}
          ${(a.flags||[]).map(f=>fh[f]||'').join('')}
        </div>
        ${a.prep?`<div class="aprep">${a.prep}</div>`:''}
      </div>
    </div>`).join('');
}

function renderEmails(){
  document.getElementById('emCnt').textContent=emailItems.length;
  const al={r:'Ação',a:'Arquivar',w:'Aguardar'};
  const ac={r:'ea-r',a:'ea-a',w:'ea-w'};
  document.getElementById('emBody').innerHTML=emailItems.map(e=>`
    <div class="ei">
      <div class="edot d${e.priority.charAt(0)==='l'?'l':e.priority.charAt(0)==='m'?'m':'h'}"></div>
      <div style="flex:1">
        <div class="efrom">${e.from}</div>
        <div class="esubj">${e.subject}</div>
        <div class="esum">${e.summary}</div>
        ${showHist&&e.history?`<div class="ehist"><span class="ehlbl">Fonte: </span>${e.history}</div>`:''}
        <span class="eact ${ac[e.action]}">${al[e.action]}</span>
      </div>
    </div>`).join('');
}

function renderWeek(){
  let tot=0;
  document.getElementById('wkGrid').innerHTML=weekData.map(d=>{
    tot+=d.events.length;
    return `<div class="dcol">
      <div class="dhdr${d.isToday?' today':d.isPast?' past':''}">
        <div class="dname">${d.day}</div><div class="ddate">${d.date}</div>
      </div>
      <div class="dbody">
        ${!d.events.length?'<div class="dempty">sem eventos</div>':d.events.map(e=>`
          <div class="dev ${e.type==='u'?'dev-u':e.type==='e'?'dev-e':e.type==='p'?'dev-p':'dev-i'}">
            <span class="devtime">${e.t}</span><span class="devname">${e.n}</span>
          </div>`).join('')}
      </div></div>`;
  }).join('');
  document.getElementById('wkCnt').textContent=tot+' eventos';
}

function renderActions(){
  const open=actionItems.filter(a=>a.status==='open').length;
  document.getElementById('acCnt').textContent=open+' abertos';
  let items=[...actionItems];
  if(af==='open') items=items.filter(a=>a.status==='open');
  if(af==='done') items=items.filter(a=>a.status==='done');
  if(tf!=='all') items=items.filter(a=>a.tags&&a.tags.includes(tf));
  const allTags=[...new Set(actionItems.flatMap(a=>a.tags||[]))];
  document.getElementById('ftabs').innerHTML=[{id:'all',lbl:'Todos'},...allTags.map(t=>({id:t,lbl:t}))].map(t=>`<button class="ftab ${tf===t.id?'active':''}" onclick="setTF('${t.id}')">${t.lbl}</button>`).join('');
  const tc={'partner':'at-p','enablement':'at-e','follow-up':'at-f','prep':'at-r'};
  const groups=[
    {p:'high',lbl:'HIGH PRIORITY',cls:'plbl-h',icon:''},
    {p:'medium',lbl:'MEDIUM PRIORITY',cls:'plbl-m',icon:''},
    {p:'low',lbl:'LOW PRIORITY',cls:'plbl-l',icon:''},
  ].map(g=>({...g,items:items.filter(a=>a.priority===g.p)})).filter(g=>g.items.length);
  document.getElementById('acBody').innerHTML=groups.map(g=>`
    <div class="pg">
      <div class="plbl ${g.cls}">${g.lbl}</div>
      ${g.items.map(a=>`
        <div class="ait ${a.status==='done'?'done':!a.inherited?'new-today':''}" id="ai-${a.id}">
          <div class="achk ${a.status==='done'?'chk':''}" onclick="tog('${a.id}')">${a.status==='done'?'v':''}</div>
          <div style="flex:1">
            <div class="aititle">${!a.inherited?'<span class="new-badge">NOVO</span> ':'<span class="inh">HERD</span> '}${a.title}</div>
            <div class="aimeta2">
              ${(a.partnerName||a.customerName)?`<span class="atag at-p">${a.partnerName||a.customerName}</span>`:''}
              ${(a.tags||[]).map(t=>`<span class="atag ${tc[t]||''}">${t}</span>`).join('')}
              <span class="asrc">${a.source}</span>
              ${a.dueDate?`<span class="adue ${['HOJE','VENCIDO'].includes(a.dueDate)||a.dueDate<='2026-08-12'?'adue-u':''}">prazo: ${a.dueDate}</span>`:''}
            </div>
            <div style="font-size:11px;color:var(--tm);margin-top:3px">${a.summary||''}</div>
          </div>
        </div>`).join('')}
    </div>`).join('');
}

function renderSlack(){
  document.getElementById('slCnt').textContent=slackItems.length+' DM'+(slackItems.length!==1?'s':'');
  if(!slackItems.length){
    document.getElementById('slBody').innerHTML='<div style="text-align:center;padding:24px 0;color:var(--tm);font-size:12px">&#10003; Sem menções diretas nas últimas 48h.</div>';
    return;
  }
  document.getElementById('slBody').innerHTML=slackItems.map(s=>`
    <div class="si">
      <div class="savt">${s.avatar}</div>
      <div style="flex:1">
        <div class="sch">${s.channel} ${s.unread?'<span class="sunrd">não lido</span>':''}</div>
        <div class="ssndr">${s.sender}</div>
        <div class="stxt">${s.text}</div>
        <div class="stime">${s.time}</div>
      </div>
    </div>`).join('');
}

function tog(id){const a=actionItems.find(x=>x.id===id);if(a){a.status=a.status==='open'?'done':'open';renderActions();renderStats();}}
function setAF(f){af=f;renderActions();}
function setTF(t){tf=t;renderActions();}
function toggleHist(){showHist=!showHist;renderEmails();}

renderAll();
</script>

<!-- ░░ MROVERE hybrid layer — +task, persist-done, hide-completed ░░ -->
<style>
.ait{position:relative}
.hx-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s;z-index:5}
.ait:hover .hx-actions{opacity:1}
.hx-btn{border:none;border-radius:5px;font-size:10px;font-weight:700;padding:3px 8px;cursor:pointer;line-height:1.4}
.hx-task{background:#00A1D5;color:#fff}.hx-task:hover{background:#0089b5}
.hx-done{background:#00C48C;color:#04361f}.hx-done:hover{background:#00b07d}
</style>
<script>
(function(){
  "use strict";
  var ORIGIN=location.origin, embedded=window.parent&&window.parent!==window, doneIds={}, master=null;
  var origRender=window.renderActions;
  function snap(){ if(!master&&typeof actionItems!=='undefined') master=actionItems.slice(); }
  function filt(){ snap(); if(master) actionItems=master.filter(function(a){return !doneIds[a.id];}); }
  function rerender(){ filt(); if(origRender) origRender(); decorate();
    if(typeof renderStats==='function') renderStats(); if(typeof renderBanner==='function') renderBanner(); }
  function decorate(){
    var body=document.getElementById('acBody'); if(!body) return;
    var els=body.querySelectorAll('.ait');
    for(var i=0;i<els.length;i++){ (function(el){
      if(el.querySelector('.hx-actions')) return;
      var id=el.id.replace(/^ai-/,'');
      var w=document.createElement('div'); w.className='hx-actions';
      var t=document.createElement('button'); t.className='hx-btn hx-task'; t.textContent='＋ task';
      t.onclick=function(e){e.stopPropagation();toTask(id);};
      var d=document.createElement('button'); d.className='hx-btn hx-done'; d.textContent='✓ concluir';
      d.onclick=function(e){e.stopPropagation();markDone(id);};
      w.appendChild(t); w.appendChild(d); el.appendChild(w);
    })(els[i]); }
  }
  function markDone(id){ doneIds[id]=true; post({type:'brief-done',id:id}); rerender(); }
  function toTask(id){ var it=(master||[]).find(function(a){return a.id===id;});
    if(!it&&typeof actionItems!=='undefined') it=actionItems.find(function(a){return a.id===id;});
    if(it){ doneIds[id]=true; post({type:'brief-to-task',item:it}); rerender(); } }
  window.tog=function(id){ markDone(id); };
  function post(m){ if(embedded){ try{ parent.postMessage(m,ORIGIN); }catch(e){} } }
  window.addEventListener('message',function(e){ if(e.origin!==ORIGIN) return;
    if(e.data&&e.data.type==='brief-state'){ doneIds=e.data.doneIds||{}; rerender(); } });
  function boot(){ snap(); post({type:'brief-ready'}); if(!embedded) rerender(); }
  if(document.readyState!=='loading') boot(); else document.addEventListener('DOMContentLoaded',boot);
})();
</script>
