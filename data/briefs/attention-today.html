const slackItems = [];

// ── RENDER ENGINE ─────────────────────────────────────────────────────────

let showHist = false;
let actionFilter = 'open';
let activePartner = 'all';

function renderAll(){renderPbanner();renderStats();renderMotive();renderAgenda();renderEmails();renderWeek();renderActions();renderSlack();}

function renderPbanner(){
  const urgent = [];
  const today = new Date().toISOString().slice(0,10);
  actionItems.forEach(a=>{
    if(a.status==='open' && a.dueDate && a.dueDate<=today) urgent.push(a.title.slice(0,45));
  });
  urgent.unshift('⚠️ Conflito 12h: SE T1 vs Anthropic Adversary View');
  urgent.unshift('🔴 Vision 15:30 → Vortex/Copersucar 16:00 (back-to-back)');
  const pb = document.getElementById('pbanner');
  const pi = document.getElementById('pitems');
  if(urgent.length===0){pb.style.display='none';return;}
  pb.style.display='flex';
  pi.innerHTML = urgent.map(u=>`<span class="ppill">${u}</span>`).join('');
}

function renderStats(){
  const open = actionItems.filter(a=>a.status==='open').length;
  const inherited = actionItems.filter(a=>a.inherited&&a.status==='open').length;
  const high = actionItems.filter(a=>a.priority==='high'&&a.status==='open').length;
  document.getElementById('stats').innerHTML = `
    <div class="scard"><span class="sicon">&#128197;</span><div><div class="sval">${agendaItems.length}</div><div class="slbl">Hoje</div><div class="sdelta">7 eventos</div></div></div>
    <div class="scard"><span class="sicon">&#128236;</span><div><div class="sval">${emailItems.length}</div><div class="slbl">E-mails</div><div class="sdelta">14 não lidos</div></div></div>
    <div class="scard"><span class="sicon">&#9889;</span><div><div class="sval">${high}</div><div class="slbl">High Priority</div><div class="sdelta">${open} abertos total</div></div></div>
    <div class="scard"><span class="sicon">&#128203;</span><div><div class="sval">${inherited}</div><div class="slbl">Herdados</div><div class="sdelta">de dias anteriores</div></div></div>
    <div class="scard"><span class="sicon">&#128172;</span><div><div class="sval">${slackItems.length}</div><div class="slbl">Slack</div><div class="sdelta">sem menções</div></div></div>
  `;
}

function renderMotive(){
  document.getElementById('motive').innerHTML = `<strong>Em campo na TDEC (Fortaleza):</strong> Tarde cheia com Vision (NFR 15:30) e PoV IE na Copersucar (16:00). Manhã: decidir entre SE T1 Enablement e Anthropic Adversary View — ambos às 12h. O Adversary View com Claude é novidade estratégica que impacta seu pitch de canal.`;

function renderAgenda(){
  const cnt = document.getElementById('agCnt');

  cnt.textContent = agendaItems.length;
  if(agendaItems.length===0){
    body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--tm);font-size:12px">Sem eventos.</div>';
    return;
  }
  body.innerHTML = agendaItems.map(a=>`
    <div class="ai">
      <span class="aitime">${a.time}</span>
      <div style="flex:1">
        <div class="ainame">${a.title}</div>
        <div class="aimeta">
          ${a.flags&&a.flags.includes('urgent')?'<span class="flag f-urgent">🔴 URGENTE</span>':''}
          ${a.flags&&a.flags.includes('back')?'<span class="flag f-back">🟡 BACK-TO-BACK</span>':''}
          ${a.flags&&a.flags.includes('ext')?'<span class="flag f-ext">EXTERNO</span>':''}
          ${a.flags&&a.flags.includes('conflict')?'<span class="flag f-conflict">⚠️ CONFLITO</span>':''}
          ${a.link?`<a class="alink" href="${a.link}" target="_blank">🔗 Link</a>`:''}

        ${a.attendees?`<div style="font-size:11px;color:var(--tm);margin-top:3px">${a.attendees}</div>`:''}

    </div>`).join('');
}

function toggleHist(){showHist=!showHist;renderEmails();}

function renderEmails(){
  const items = emailItems;
  document.getElementById('emCnt').textContent = items.length;
  document.getElementById('emBody').innerHTML = items.map(e=>`
    <div class="ei">
      <div class="edot ${e.priority==='high'?'dh':e.priority==='medium'?'dm':'dl'}"></div>

        <div class="esubj">${e.subject}</div>
        <div class="esum">${e.summary}</div>
        ${showHist&&e.history?`<div class="ehist"><span class="ehlbl">Histórico:</span> ${e.history}</div>`:''}
        <span class="eact ${e.action==='r'?'ea-r':e.action==='a'?'ea-a':'ea-w'}">${e.action==='r'?'↩ Responder':e.action==='a'?'📁 Arquivar':'⏳ Aguardar'}</span>
      </div>
    </div>`).join('');
}

function renderWeek(){
  const grid = document.getElementById('wkGrid');
  document.getElementById('wkCnt').textContent = weekData.reduce((s,d)=>s+d.events.length,0);
  grid.innerHTML = weekData.map(d=>{
    const isPast = d.isPast;
    const isToday = d.isToday;
    return `<div class="dcol">
      <div class="dhdr ${isToday?'today':isPast?'past':''}">
        <div class="dname">${d.day}</div>
        <div class="ddate">${d.date}</div>
      </div>
      <div class="dbody">
        ${d.events.length===0?'<div class="dempty">—</div>':
          d.events.map(e=>`<div class="dev dev-${e.type||'i'}">
            <span class="devtime">${e.t}</span>
            <span class="devname">${e.n}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function setAF(f){actionFilter=f;renderActions();}

function renderActions(){
  const cnt = document.getElementById('acCnt');
  const body = document.getElementById('acBody');
  const ftabs = document.getElementById('ftabs');

  const partners = ['all',...new Set(actionItems.map(a=>a.partnerName||a.customerName||'Interno').filter(Boolean))];
  ftabs.innerHTML = partners.map(p=>`<button class="ftab ${p===activePartner?'active':''}" onclick="activePartner='${p}';renderActions()">${p==='all'?'Todos':p}</button>`).join('');

  let items = actionItems;
  if(actionFilter!=='all') items = items.filter(a=>a.status===actionFilter);
  if(activePartner!=='all') items = items.filter(a=>(a.partnerName||a.customerName||'Interno')===activePartner);

  cnt.textContent = actionItems.filter(a=>a.status==='open').length;

  const high = items.filter(a=>a.priority==='high');
  const med = items.filter(a=>a.priority==='medium');
  const low = items.filter(a=>a.priority==='low');

  const today = new Date().toISOString().slice(0,10);

  function renderGroup(label,cls,arr){
    if(!arr.length) return '';
    return `<div class="pg"><div class="plbl ${cls}">▲ ${label} (${arr.length})</div>
    ${arr.map(a=>`<div class="ait ${a.status==='done'?'done':''} ${!a.inherited&&a.createdAt&&a.createdAt.slice(0,10)===today?'new-today':''}" id="ait-${a.id}">
      <div class="achk ${a.status==='done'?'chk':''}" onclick="toggleDone('${a.id}')">${a.status==='done'?'✓':''}</div>
      <div style="flex:1">
        <div class="aititle">${a.title}</div>
        <div class="aimeta2">
          ${a.inherited?'<span class="inh">📌 HERDADO</span>':'<span class="new-badge">NOVO</span>'}
          ${a.partnerName?`<span class="atag at-p">👥 ${a.partnerName}</span>`:''}
          ${a.customerName?`<span class="atag at-r">🏢 ${a.customerName}</span>`:''}
          ${a.dueDate?`<span class="adue ${a.dueDate<today?'adue-u':''}">📅 ${a.dueDate}</span>`:''}
          <span class="asrc">via ${a.source}</span>
        </div>
        ${a.summary?`<div style="font-size:11px;color:var(--tm);margin-top:3px">${a.summary}</div>`:''}
      </div>
    </div>`).join('')}
    </div>`;
  }

  body.innerHTML = renderGroup('HIGH PRIORITY','plbl-h',high)+renderGroup('MEDIUM','plbl-m',med)+renderGroup('LOW','plbl-l',low);
  if(!body.innerHTML.trim()) body.innerHTML='<div style="text-align:center;padding:20px;color:var(--tm)">Nenhum item encontrado.</div>';
}

function toggleDone(id){
  const a = actionItems.find(x=>x.id===id);
  if(a) a.status = a.status==='done'?'open':'done';
  renderActions();renderStats();
}

function renderSlack(){
  const cnt = document.getElementById('slCnt');
  const body = document.getElementById('slBody');
  cnt.textContent = slackItems.length;
  if(!slackItems.length){
    body.innerHTML='<div style="text-align:center;padding:20px;color:var(--tm);font-size:12px">✅ Sem menções pendentes no Slack.</div>';
    return;
  }
  body.innerHTML = slackItems.map(s=>`
    <div class="si">
      <div class="savt">${s.from.slice(0,2).toUpperCase()}</div>
      <div style="flex:1">
        <div class="sch">${s.channel}</div>
        <div class="ssndr">${s.from}</div>
        <div class="stxt">${s.text}</div>
        <div style="display:flex;gap:5px;align-items:center;margin-top:3px">
          <span class="stime">${s.ago}</span>
          ${s.unread?'<span class="sunrd">NÃO LIDO</span>':''}
        </div>
      </div>
    </div>`).join('');
}

renderAll();
</script>

<!-- ░░ MROVERE hybrid layer — +task, persist-done, hide-completed ░░ -->
<style>
.ait{position:relative}
.hx-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s;z-index:5}
.ait:hover .hx-actions{opacity:1}
.hx-btn{border:none;border-radius:5px;font-size:10px;font-weight:700;padding:3px 8px;cursor:pointer;line-height:1.4}
.hx-task{background:#00A1D5;color:#fff}.hx-task:hover{background:#0089b5}
.hx-done{background:#00C48C;color:#04361f}.hx-done:hover{background:#00b07d}
</style>
<script>
(function(){
  "use strict";
  var ORIGIN=location.origin, embedded=window.parent&&window.parent!==window, doneIds={}, master=null;
  var origRender=window.renderActions;
  function snap(){ if(!master&&typeof actionItems!=='undefined') master=actionItems.slice(); }
  function filt(){ snap(); if(master) actionItems=master.filter(function(a){return !doneIds[a.id];}); }
  function rerender(){ filt(); if(origRender) origRender(); decorate();
    if(typeof renderStats==='function') renderStats(); if(typeof renderBanner==='function') renderBanner(); }
  function decorate(){
    var body=document.getElementById('acBody'); if(!body) return;
    var els=body.querySelectorAll('.ait');
    for(var i=0;i<els.length;i++){ (function(el){
      if(el.querySelector('.hx-actions')) return;
      var id=el.id.replace(/^ai-/,'');
      var w=document.createElement('div'); w.className='hx-actions';
      var t=document.createElement('button'); t.className='hx-btn hx-task'; t.textContent='＋ task';
      t.onclick=function(e){e.stopPropagation();toTask(id);};
      var d=document.createElement('button'); d.className='hx-btn hx-done'; d.textContent='✓ concluir';
      d.onclick=function(e){e.stopPropagation();markDone(id);};
      w.appendChild(t); w.appendChild(d); el.appendChild(w);
    })(els[i]); }
  }
  function markDone(id){ doneIds[id]=true; post({type:'brief-done',id:id}); rerender(); }
  function toTask(id){ var it=(master||[]).find(function(a){return a.id===id;});
    if(!it&&typeof actionItems!=='undefined') it=actionItems.find(function(a){return a.id===id;});
    if(it){ doneIds[id]=true; post({type:'brief-to-task',item:it}); rerender(); } }
  window.tog=function(id){ markDone(id); };
  function post(m){ if(embedded){ try{ parent.postMessage(m,ORIGIN); }catch(e){} } }
  window.addEventListener('message',function(e){ if(e.origin!==ORIGIN) return;
    if(e.data&&e.data.type==='brief-state'){ doneIds=e.data.doneIds||{}; rerender(); } });
  function boot(){ snap(); post({type:'brief-ready'}); if(!embedded) rerender(); }
  if(document.readyState!=='loading') boot(); else document.addEventListener('DOMContentLoaded',boot);
})();
</script>
