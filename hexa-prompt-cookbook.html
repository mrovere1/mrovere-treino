<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexa AI — Prompt Cookbook by Capability</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --pure-black: #192124;
    --soft-black: #1E2426;
    --white: #FFFFFF;
    --highlight: #E7FF00;
    --bg: var(--pure-black);
    --bg-card: var(--soft-black);
    --bg-card-hover: #252D30;
    --bg-elevated: #232A2D;
    --bg-prompt: #161C1F;
    --text: var(--white);
    --text-secondary: #A0AEB5;
    --text-dim: #5C6B72;
    --border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .gradient-bar {
    height: 3px;
    background: linear-gradient(90deg, var(--highlight), #38BDF8 60%, #8B5CF6);
  }

  .header {
    padding: 2.5rem 3rem 1.5rem;
    max-width: 1500px;
    margin: 0 auto;
  }
  .header-eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--highlight);
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .header-logo { height: 22px; width: auto; }
  .header-hexa { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em; }
  .header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.3rem; color: var(--white); }
  .header p { color: var(--text-secondary); font-size: 0.95rem; }

  .container { max-width: 1500px; margin: 0 auto; padding: 0 3rem 3rem; }

  .stats-strip {
    display: flex; gap: 1px; background: var(--border);
    border-radius: 16px; overflow: hidden; margin-bottom: 2rem;
  }
  .stat-cell { flex: 1; background: var(--bg-card); padding: 1.2rem 1rem; text-align: center; transition: background 0.2s; }
  .stat-cell:hover { background: var(--bg-elevated); }
  .stat-num { font-size: 2rem; font-weight: 800; line-height: 1; margin-bottom: 0.3rem; }
  .stat-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }

  .categories-bar {
    display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 2rem;
  }
  .cat-chip {
    padding: 0.5rem 1rem; border-radius: 8px;
    font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    background: var(--bg-card); color: var(--text-secondary);
    border: 1px solid var(--border);
    user-select: none;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .cat-chip:hover { background: var(--bg-elevated); color: var(--text); }
  .cat-chip.active {
    color: var(--pure-black);
    border-color: transparent;
  }
  .cat-chip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cat-chip .cat-count { opacity: 0.6; font-weight: 800; font-size: 0.7rem; }

  .category-banner {
    border-radius: 14px; background: var(--bg-card);
    display: flex; align-items: center; gap: 1.2rem;
    opacity: 0; transform: translateY(-8px);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none; max-height: 0; overflow: hidden;
    padding: 0 1.8rem; margin-bottom: 0;
  }
  .category-banner.visible {
    opacity: 1; transform: translateY(0); pointer-events: all;
    max-height: 120px; padding: 1.2rem 1.8rem; margin-bottom: 1.5rem;
  }
  .category-banner-icon { flex-shrink: 0; }
  .category-banner-icon svg { width: 36px; height: 36px; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .category-banner-title { font-weight: 700; font-size: 1.15rem; margin-bottom: 0.15rem; }
  .category-banner-desc { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; }

  .cards-container {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 1rem; margin-bottom: 2rem;
  }
  .uc-card {
    background: var(--bg-card); border-radius: 14px;
    position: relative; overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid var(--border); cursor: default;
  }
  .uc-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--accent); border-radius: 3px 0 0 3px;
    transition: width 0.2s;
  }
  .uc-card:hover {
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .uc-card:hover::before { width: 4px; }

  .card-body { padding: 1.2rem 1.4rem; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 0.5rem; }
  .card-name { font-weight: 700; font-size: 1rem; line-height: 1.3; flex: 1; }

  .card-tags { display: flex; gap: 0.3rem; margin-bottom: 0.6rem; flex-wrap: wrap; align-items: center; }
  .mini-tag {
    font-size: 0.65rem; font-weight: 600; padding: 0.12rem 0.5rem;
    border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em;
    display: inline-flex; align-items: center; gap: 0.3rem;
  }
  .mini-tag svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .mini-tag.cat-tag { color: white; }

  .card-desc { color: var(--text-secondary); font-size: 0.85rem; line-height: 1.55; }

  .prompts-toggle {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 1.4rem;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid var(--border);
    cursor: pointer; transition: background 0.2s;
    user-select: none;
  }
  .prompts-toggle:hover { background: rgba(255,255,255,0.05); }
  .prompts-toggle svg {
    width: 16px; height: 16px; stroke: var(--accent);
    fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    transition: transform 0.3s;
  }
  .prompts-toggle.open svg { transform: rotate(90deg); }
  .prompts-toggle-label {
    font-size: 0.78rem; font-weight: 600; color: var(--accent);
    letter-spacing: 0.02em;
  }
  .prompts-toggle-count {
    font-size: 0.68rem; color: var(--text-dim); font-weight: 500;
    margin-left: auto;
  }

  .prompts-drawer {
    max-height: 0; overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--bg-prompt);
    border-top: 1px solid transparent;
  }
  .prompts-drawer.open {
    border-top-color: var(--border);
  }
  .prompts-inner { padding: 0.8rem 1.4rem 1rem; }

  .prompt-item {
    margin-bottom: 0.8rem;
    position: relative;
    padding-left: 1.6rem;
  }
  .prompt-item:last-child { margin-bottom: 0; }

  .prompt-bullet {
    position: absolute; left: 0; top: 0.35rem;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); opacity: 0.5;
  }

  .prompt-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 0.65rem 0.9rem;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }
  .prompt-text::before {
    content: '>';
    position: absolute;
    left: -1.2rem; top: 0.65rem;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.75rem;
    opacity: 0.6;
  }

  .empty { text-align: center; padding: 4rem 2rem; color: var(--text-dim); }
  .empty-icon { margin-bottom: 0.8rem; }
  .empty-icon svg { width: 48px; height: 48px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; }
  .empty-text { font-size: 1rem; }

  .uc-card { animation: cardIn 0.3s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 900px) {
    .header, .container { padding-left: 1.5rem; padding-right: 1.5rem; }
    .cards-container { grid-template-columns: 1fr; }
    .categories-bar { gap: 0.3rem; }
  }
</style>
</head>

let activeCategory = null;

function luminance(hex) {
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  return 0.299*r + 0.587*g + 0.114*b;
}

function buildCategoriesBar() {
  const el = document.getElementById("categoriesBar");
  el.innerHTML = "";

  const allChip = document.createElement("div");
  allChip.className = "cat-chip" + (!activeCategory ? " active" : "");
  if (!activeCategory) { allChip.style.background = "var(--text)"; allChip.style.color = "var(--pure-black)"; }
  allChip.innerHTML = `All <span class="cat-count">${UCS.length}</span>`;
  allChip.onclick = () => { activeCategory = null; render(); };
  el.appendChild(allChip);

  CATEGORIES.forEach(cat => {
    const count = UCS.filter(uc => uc.c === cat.id).length;
    const chip = document.createElement("div");
    const isActive = activeCategory === cat.id;
    chip.className = "cat-chip" + (isActive ? " active" : "");
    if (isActive) { chip.style.background = cat.color; chip.style.color = luminance(cat.color) > 0.55 ? '#192124' : '#fff'; }
    chip.innerHTML = `${ICONS[cat.icon]} ${cat.name} <span class="cat-count">${count}</span>`;
    chip.onclick = () => { activeCategory = activeCategory === cat.id ? null : cat.id; render(); };
    el.appendChild(chip);
  });
}

function updateBanner() {
  const el = document.getElementById("categoryBanner");
  if (!activeCategory) { el.classList.remove("visible"); return; }
  const cat = CATEGORIES.find(c => c.id === activeCategory);
  el.style.borderLeft = `4px solid ${cat.color}`;
  el.innerHTML = `
    <div class="category-banner-icon" style="color:${cat.color}">${ICONS[cat.icon].replace(/stroke="[^"]*"/g, `stroke="${cat.color}"`)} </div>
    <div>
      <div class="category-banner-title" style="color:${cat.color}">${cat.name}</div>
      <div class="category-banner-desc">${cat.desc}</div>
    </div>`;
  el.classList.add("visible");
}

function buildStats(filtered) {
  const el = document.getElementById("stats");
  const totalPrompts = filtered.reduce((s, u) => s + (u.prompts?.length || 0), 0);
  const catCounts = CATEGORIES.map(c => ({name: c.name, count: filtered.filter(uc => uc.c === c.id).length, color: c.color})).filter(x => x.count > 0);
  el.innerHTML = [
    {n: filtered.length, l:"Use Cases", c:"var(--text)"},
    {n: totalPrompts, l:"Example Prompts", c:"var(--highlight)"},
    {n: CATEGORIES.length, l:"Capabilities", c:"#A78BFA"},
  ].map(s => `<div class="stat-cell"><div class="stat-num" style="color:${s.c}">${s.n}</div><div class="stat-label">${s.l}</div></div>`).join("");
}

function buildCards(filtered) {
  const grid = document.getElementById("cards");
  const empty = document.getElementById("empty");
  grid.innerHTML = "";
  const catOrder = {};
  CATEGORIES.forEach((c, i) => catOrder[c.id] = i);
  filtered.sort((a, b) => (catOrder[a.c]??99) - (catOrder[b.c]??99));
  if (!filtered.length) { empty.style.display = "block"; return; }
  empty.style.display = "none";

  filtered.forEach((uc, i) => {
    const cat = CATEGORIES.find(c => c.id === uc.c);
    const promptCount = uc.prompts?.length || 0;
    const cardId = `card-${i}`;

    const card = document.createElement("div");
    card.className = "uc-card";
    card.style.setProperty("--accent", cat.color);
    card.style.animationDelay = `${i * 25}ms`;

    let promptsHTML = '';
    if (promptCount > 0) {
      const items = uc.prompts.map(pr => `
        <div class="prompt-item">
          <div class="prompt-bullet" style="background:${cat.color}"></div>
          <div class="prompt-text">${pr.text}</div>
        </div>
      `).join('');

      promptsHTML = `
        <div class="prompts-toggle" onclick="togglePrompts('${cardId}')" style="--accent:${cat.color}">
          ${ICONS.chevron_right}
          <span class="prompts-toggle-label">Example Prompts</span>
          <span class="prompts-toggle-count">${promptCount} prompt${promptCount!==1?'s':''}</span>
        </div>
        <div class="prompts-drawer" id="drawer-${cardId}">
          <div class="prompts-inner">${items}</div>
        </div>`;
    }

    card.innerHTML = `
      <div class="card-body">
        <div class="card-top">
          <div class="card-name">${uc.n}</div>
        </div>
        <div class="card-tags">
          <span class="mini-tag cat-tag" style="background:${cat.color};color:${luminance(cat.color) > 0.55 ? '#192124' : '#fff'}">${ICONS[cat.icon]} ${cat.name}</span>
        </div>
        <div class="card-desc">${uc.desc}</div>
      </div>
      ${promptsHTML}`;
    grid.appendChild(card);
  });
}

function togglePrompts(cardId) {
  const drawer = document.getElementById(`drawer-${cardId}`);
  const toggle = drawer.previousElementSibling;
  const isOpen = drawer.classList.contains('open');
  if (isOpen) {
    drawer.style.maxHeight = '0';
    drawer.classList.remove('open');
    toggle.classList.remove('open');
  } else {
    drawer.classList.add('open');
    toggle.classList.add('open');
    drawer.style.maxHeight = drawer.scrollHeight + 'px';
  }
}

function render() {
  const filtered = UCS.filter(uc => {
    if (activeCategory && uc.c !== activeCategory) return false;
    return true;
  });
  buildCategoriesBar(); updateBanner(); buildStats(filtered); buildCards(filtered);
}

render();
